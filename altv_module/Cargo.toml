[package]
name = "altv_module"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
reloading = ["relib_host/unloading"]

[dependencies]
altv_sdk = { path = "../altv_sdk", package = "altv_internal_sdk", version = "=16.4.2" }
core_shared = { path = "../core_shared", package = "altv_internal_core_shared", version = "=16.4.2" }
logger = { path = "../logger", package = "altv_internal_logger", version = "=16.4.2" }
paste = { workspace = true }
autocxx = { workspace = true }
lazy_static = { workspace = true }
relib_interface = { version = "0.4.2", features = ["include"] }
libloading = "0.8.6"

[dependencies.relib_host]
version = "0.4.2"
features = ["super_special_reinit_of_dbghelp"]

[lib]
crate-type = ["cdylib"]

[build-dependencies]
relib_interface = { version = "0.4.2", features = ["build"] }
core_shared = { path = "../core_shared", package = "altv_internal_core_shared", version = "=16.4.2" }
