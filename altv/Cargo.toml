[package]
name = "altv"
description = "Rust server-side API for writing your gamemodes on alt:V"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
altv_sdk = { path = "../altv_sdk", package = "altv_internal_sdk", version = "=16.2.3-test.15" }
resource_main_macro = { path = "../resource_main_macro", package = "altv_internal_resource_main_macro", version = "=16.2.3-test.15" }
core_resource = { path = "../core_resource", package = "altv_internal_core_resource", version = "=16.2.3-test.15" }

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[features]
# Enable support for clientside JS WASM API
clientside = ["core_resource/clientside"]
