[package]
name = "altv"
description = "Rust server-side API for writing your gamemodes on alt:V"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
reloading = ["relib_module/unloading"]
# Enable support for clientside JS WASM API
clientside = ["core_resource/clientside"]

[dependencies]
altv_sdk = { path = "../altv_sdk", package = "altv_internal_sdk", version = "=16.3.0" }
resource_main_macro = { path = "../resource_main_macro", package = "altv_internal_resource_main_macro", version = "=16.3.0" }
core_resource = { path = "../core_resource", package = "altv_internal_core_resource", version = "=16.3.0" }

# relib_module = "0.4.1"
# // TEST
relib_module.path = "../../../rust/relib/module"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
