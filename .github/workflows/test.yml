name: Test

on:
  push:
    branches: "*"
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-22.04

    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: rust version
        run: rustc -V
          
      - name: cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: doc tests
        run: |
          cargo test --doc
        
      - name: check examples
        run: |
          cd examples/reloading
          cargo build --workspace
          cargo build --workspace --features reloading

      - name: server test
        env:
          ALTV_BRANCH: ${{ github.ref_name }}
        run: |
          cargo run --bin run_test

  test-windows:
    runs-on: windows-2022

    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: rust version
        run: rustc -V

      - name: install winget
        uses: Cyberboss/install-winget@v1

      - name: install LLVM 17.0.1
        shell: powershell
        run: winget install LLVM.LLVM --version 17.0.1 --disable-interactivity --accept-source-agreements --force
          
      - name: cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: doc tests
        shell: cmd
        # temp workaround https://github.com/google/autocxx/issues/1327
        run: |
          set PATH=%PATH:C:\Program Files\LLVM\bin;=%
          echo %PATH%

          cargo test --doc

      - name: check examples
        run: |
          cd examples/reloading
          cargo build --workspace
          cargo build --workspace --features reloading

      - name: server test
        env:
          ALTV_BRANCH: ${{ github.ref_name }}
        shell: cmd
        # temp workaround https://github.com/google/autocxx/issues/1327
        run: |
          set PATH=%PATH:C:\Program Files\LLVM\bin;=%
          echo %PATH%

          cargo run --bin run_test
