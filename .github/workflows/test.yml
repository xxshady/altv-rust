name: Test

on:
  push:
    branches: "*"
  pull_request:

jobs:
  test-windows:
    runs-on: windows-2022

    if: ${{ !startsWith(github.event.head_commit.message, 'release new version:') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install latest stable rust
        run: rustup update
          
      - name: Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Clang version
        run: |
          clang --version

      - name: Install winget
        uses: Cyberboss/install-winget@v1

      - name: Update
        shell: cmd
        run: |
          winget install LLVM.LLVM --silent --accept-source-agreements

      - name: Clang version again
        run: |
          clang --version
          
      - name: build
        shell: cmd
        # temp workaround https://github.com/google/autocxx/issues/1327
        run: |
          echo %PATH%
          set PATH=%PATH:C:\Program Files\LLVM\bin;=%
          echo %PATH%

          cargo build -vv
