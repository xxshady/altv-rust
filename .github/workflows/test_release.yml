# TODO: remove this file

name: test-release

on:
  push:
    tags:
      - 'test-release-v*'

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: extract version from tag
        id: extract_version
        run: |
          VERSION=$( echo ${{ github.ref_name }} | grep -oP 'test-release-v\K.*' )
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: print it
        run: echo ${{ steps.extract_version.outputs.VERSION }}

      - name: cargo login
        run: cargo login ${{ secrets.CRATES_IO_TOKEN }}

      - name: install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.12

      - name: install cargo-release
        run: |
          cargo binstall cargo-release --no-confirm
      - name: cargo release
        run: |
          cargo release ${{ steps.extract_version.outputs.VERSION }} --exclude cargo-altvup --no-confirm --execute

