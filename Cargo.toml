[workspace]
resolver = "2"

members = [
  "core_shared",
  "core_module",
  "core_resource",
  "mvalue",
  "resource_main_macro",
  "altv_sdk",
  "altv_module",
  "logger",
  "altv",
  "cpp_codegen",
  "test/rust_resource",
  "test/run_test",
  "altvup",
]

[workspace.package]
version = "16.2.3-test.0"
rust-version = "1.82.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/xxshady/altv-rust"
readme = "README.md"

[workspace.dependencies]
cxx = "1.0.115"
autocxx = "0.26.0"
anyhow = "1.0.83"
paste = "1.0.14"
lazy_static = "1.4.0"
serde = { version = "1.0.195", features = ["derive", "rc"] }
serde_bytes = "0.11.14"
erased-serde = "0.3.31"

# TODO: remove it, use altvup in run_test
reqwest = "0.12.9"

[workspace.metadata.release]
pre-release-commit-message = "release new version: {{version}}"
tag = false
allow-branch = ["*"]
